<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPLEAT 데일리 신문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600;700&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EEE3;
  --ink:#0B0B0B;
  --ink-2:#3A3833;
  --muted:#6E6A60;
  --red:#FF2E00;
  --rule:3px solid var(--ink);
  --hair:1px solid var(--ink);
  --serif:"Noto Serif KR", "AppleMyungjo", serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  --display:"Black Han Sans", "Noto Serif KR", sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px);background-size:3px 3px;}
a{color:inherit;text-decoration:none;}
.sheet{max-width:1320px;margin:0 auto;padding:20px 24px 80px;}
@media (max-width:640px){.sheet{padding:12px 16px 60px;}}

/* 상단 띠 */
.backbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding-bottom:10px;}
.backbar a{border:var(--hair);padding:4px 10px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);}
.backbar a:hover{background:var(--ink);color:var(--paper);}
.beta{background:var(--red);color:#fff;padding:4px 8px;}

.dateline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-top:var(--rule);border-bottom:var(--hair);padding:8px 0;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.03em;}
.dateline .c{text-align:center;}
.dateline .r{text-align:right;}
@media (max-width:640px){.dateline{grid-template-columns:1fr;gap:2px;text-align:left;}.dateline .c,.dateline .r{text-align:left;}}

/* 제호 */
.masthead{text-align:center;padding:18px 0 10px;border-bottom:8px double var(--ink);}
.masthead h1{font-family:var(--display);font-weight:400;font-size:clamp(56px, 11vw, 148px);line-height:.92;margin:0;letter-spacing:-.02em;}
.masthead .sub{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;margin-top:12px;}
@media (max-width:640px){.masthead .sub{letter-spacing:.14em;font-size:11px;}}

/* 속보 띠 */
.ticker{display:flex;align-items:stretch;border-bottom:var(--rule);overflow:hidden;background:var(--ink);color:var(--paper);}
.ticker-label{flex:0 0 auto;background:var(--red);color:#fff;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.1em;padding:10px 14px;display:flex;align-items:center;}
.ticker-track{flex:1;overflow:hidden;position:relative;}
.ticker-move{display:inline-flex;white-space:nowrap;gap:48px;padding:10px 0;font-size:14.5px;font-weight:600;animation:tick 60s linear infinite;}
.ticker-move b{color:var(--red);font-weight:700;}
.ticker:hover .ticker-move{animation-play-state:paused;}
@keyframes tick{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@media (prefers-reduced-motion: reduce){.ticker-move{animation:none;white-space:normal;flex-direction:column;gap:8px;padding:10px 14px;}}

/* 1면 */
.front{display:grid;grid-template-columns:repeat(12,1fr);gap:0;border-bottom:var(--rule);}
.lead{grid-column:1 / span 8;padding:24px 24px 28px 0;border-right:var(--hair);}
.side{grid-column:9 / span 4;padding:24px 0 28px 24px;display:flex;flex-direction:column;gap:22px;}
@media (max-width:960px){.lead,.side{grid-column:1 / -1;padding:20px 0;border-right:none;}.side{border-top:var(--hair);}}
.kicker{display:inline-flex;gap:0;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:var(--hair);}
.kicker span{padding:3px 8px;}
.kicker span:first-child{background:var(--ink);color:var(--paper);}
.lead h2{font-family:var(--serif);font-weight:900;font-size:clamp(30px, 4.4vw, 54px);line-height:1.14;letter-spacing:-.025em;margin:14px 0 16px;word-break:keep-all;}
.lead h2 a:hover{background:var(--ink);color:var(--paper);}
.lead figure{margin:0 0 18px;border:var(--rule);box-shadow:8px 8px 0 var(--ink);background:#ddd;}
.lead figure img{display:block;width:100%;aspect-ratio:16/8.5;object-fit:cover;filter:grayscale(1) contrast(1.25) brightness(1.02);mix-blend-mode:multiply;}
.lead .body{font-size:17px;line-height:1.8;columns:2;column-gap:28px;column-rule:var(--hair);word-break:keep-all;}
.lead .body::first-letter{font-family:var(--display);font-size:64px;float:left;line-height:.9;padding:6px 8px 0 0;}
.lead .body b{background:var(--red);color:#fff;font-weight:700;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
@media (max-width:640px){.lead .body{columns:1;font-size:16px;}}
.byline{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);margin-top:14px;letter-spacing:.02em;}
.byline a{text-decoration:underline;text-underline-offset:3px;}

.box{border:var(--rule);background:var(--paper);box-shadow:6px 6px 0 var(--ink);}
.box-h{background:var(--ink);color:var(--paper);font-family:var(--mono);font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;display:flex;justify-content:space-between;}
.quote{padding:16px 16px 18px;border-bottom:var(--hair);}
.quote:last-child{border-bottom:none;}
.quote .who{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--red);}
.quote p{margin:6px 0 0;font-size:16px;font-weight:600;line-height:1.6;word-break:keep-all;}
.quote p b{text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--red);text-underline-offset:3px;}
.index-list{list-style:none;margin:0;padding:6px 12px 10px;font-family:var(--mono);font-size:13px;}
.index-list li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--ink);}
.index-list li:last-child{border-bottom:none;}
.index-list a:hover{color:var(--red);}

/* 지면 */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:var(--rule);padding:30px 0 8px;}
.section-h h3{font-family:var(--display);font-weight:400;font-size:clamp(34px, 5vw, 56px);line-height:1;margin:0;}
.section-h .en{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.2em;}
.cols{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:var(--hair);}
@media (max-width:1024px){.cols{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.cols{grid-template-columns:1fr;}}
.col{padding:0 18px 22px;border-left:var(--hair);}
.col:first-child{border-left:none;padding-left:0;}
@media (max-width:1024px){.col:nth-child(odd){border-left:none;padding-left:0;}.col{border-top:var(--hair);}}
@media (max-width:640px){.col{border-left:none;padding:0 0 20px;}}
.col-h{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.14em;background:var(--ink);color:var(--paper);display:inline-block;padding:4px 10px;margin:16px 0 4px;}
.story{padding:14px 0;border-bottom:var(--hair);}
.story:last-child{border-bottom:none;}
.story figure{margin:0 0 10px;border:2px solid var(--ink);}
.story figure img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;filter:grayscale(1) contrast(1.2);mix-blend-mode:multiply;}
.story h4{font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.35;margin:0 0 8px;letter-spacing:-.015em;word-break:keep-all;}
.story h4 a:hover{background:var(--ink);color:var(--paper);}
.story p{margin:0;font-size:14px;line-height:1.72;color:var(--ink-2);word-break:keep-all;}
.story p b{color:var(--ink);font-weight:700;background:linear-gradient(transparent 60%, rgba(255,46,0,.35) 60%);}
.story .meta{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted);margin-top:8px;letter-spacing:.02em;}
.empty{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding:16px 0;border:1px dashed var(--ink);text-align:center;margin-top:14px;}

/* 지난 호 */
.archive{margin-top:40px;border:var(--rule);box-shadow:6px 6px 0 var(--ink);}
.archive-list{display:flex;flex-wrap:wrap;gap:8px;padding:14px;}
.archive-list button{appearance:none;cursor:pointer;font-family:var(--mono);font-size:12.5px;font-weight:700;background:var(--paper);color:var(--ink);border:var(--hair);padding:6px 10px;}
.archive-list button:hover{background:var(--ink);color:var(--paper);}
.archive-list button[aria-current="true"]{background:var(--red);color:#fff;border-color:var(--red);}
.colophon{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center;margin-top:28px;letter-spacing:.04em;}
.loading{font-family:var(--mono);text-align:center;padding:80px 0;font-size:14px;}
</style>
</head>
<body>
<div class="sheet">
  <div class="backbar">
    <a href="index.html">← 아카이브로</a>
    <span class="beta">TEST · 신문 UI 시안</span>
  </div>

  <div class="dateline">
    <span id="vol">VOL.1 — NO.—</span>
    <span class="c" id="dateLabel">—</span>
    <span class="r">서울 · 가격 ₩0</span>
  </div>

  <header class="masthead">
    <h1>유플리트 데일리</h1>
    <div class="sub">The UPLEAT Trend Gazette — AI · UX · Design · Tech &amp; Biz</div>
  </header>

  <div class="ticker" id="ticker" hidden>
    <div class="ticker-label">오늘의 한 줄</div>
    <div class="ticker-track"><div class="ticker-move" id="tickerMove"></div></div>
  </div>

  <main id="paper"><div class="loading">신문을 인쇄하는 중…</div></main>

  <section class="archive" id="archive" hidden>
    <div class="box-h"><span>지난 호 보기</span><span>BACK ISSUES</span></div>
    <div class="archive-list" id="archiveList"></div>
  </section>

  <div class="colophon">매일 새벽 자동 발행 · 기사 제목을 누르면 원문으로 이동합니다 · UPLEAT</div>
</div>

<script>
(function(){
  var CATS = [["ai","AI"],["ux","UX"],["design","DESIGN"],["biz","TECH & BIZ"]];
  var FIRST_ISSUE = "2026-10-10";
  var LOOKBACK = 14;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  // insight/takeaway는 <b>만 허용
  function rich(s){ return esc(s).replace(/&lt;(\/?)b&gt;/g, "<$1b>"); }
  function kstToday(){ var d = new Date(Date.now() + 9*3600*1000); return d.toISOString().slice(0,10); }
  function shift(iso, n){ var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
  function issueNo(iso){ return Math.round((new Date(iso) - new Date(FIRST_ISSUE)) / 864e5) + 1; }
  function shortDate(iso){ return iso ? iso.slice(5).replace("-", ".") : ""; }

  function items(day, regionKey){
    var out = [];
    day[regionKey].categories.forEach(function(cat){
      var k = 0;
      cat.items.forEach(function(it){
        if (it.duplicate) return;
        k++;
        out.push(Object.assign({}, it, {cat: cat.key, catLabel: cat.label, regionKey: regionKey,
          id: day.intl.date + "-" + (regionKey === "intl" ? "i" : "d") + "-" + cat.key + "-" + k}));
      });
    });
    return out;
  }

  function img(it, cls){
    var local = "assets/thumbs/" + it.id + ".jpg";
    var first = it.image || local;
    var fallback = it.image ? local : "";
    return '<figure class="' + (cls || "") + '"><img loading="lazy" alt="" src="' + esc(first) + '" data-fallback="' + esc(fallback) + '" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=\'\';}else{this.closest(\'figure\').remove();}"></figure>';
  }

  function meta(it){
    return esc(it.source) + (it.pubDate ? " · " + shortDate(it.pubDate) : "");
  }

  function pickLead(day){
    var all = items(day, "intl").concat(items(day, "domestic"));
    return all.find(function(it){ return it.image; }) || all[0];
  }

  function render(day, dates){
    var date = day.intl.date;
    document.getElementById("dateLabel").textContent = day.intl.dateLabel;
    document.getElementById("vol").textContent = "VOL.1 — NO." + issueNo(date);

    var tm = document.getElementById("tickerMove");
    var line = '<span>해외 ▸ ' + rich(day.intl.takeawayHtml) + '</span><span>국내 ▸ ' + rich(day.domestic.takeawayHtml) + '</span>';
    tm.innerHTML = line + line;
    document.getElementById("ticker").hidden = false;

    var lead = pickLead(day);
    var html = "";
    if (lead){
      html += '<section class="front"><article class="lead">'
        + '<div class="kicker"><span>1면 톱</span><span>' + (lead.regionKey === "intl" ? "해외" : "국내") + ' · ' + esc(lead.catLabel) + '</span></div>'
        + '<h2><a href="' + esc(lead.url) + '" target="_blank" rel="noopener">' + esc(lead.title) + '</a></h2>'
        + (lead.image ? img(lead) : "")
        + '<div class="body">' + rich(lead.insight) + '</div>'
        + '<div class="byline">출처 ' + meta(lead) + ' · <a href="' + esc(lead.url) + '" target="_blank" rel="noopener">원문 읽기 →</a></div>'
        + '</article><aside class="side">'
        + '<div class="box"><div class="box-h"><span>오늘의 한 줄</span><span>EDITORIAL</span></div>'
        + '<div class="quote"><div class="who">해외 INTERNATIONAL</div><p>' + rich(day.intl.takeawayHtml) + '</p></div>'
        + '<div class="quote"><div class="who">국내 DOMESTIC</div><p>' + rich(day.domestic.takeawayHtml) + '</p></div></div>'
        + '<div class="box"><div class="box-h"><span>이번 호 목차</span><span>INDEX</span></div><ul class="index-list">'
        + [["intl","해외판"],["domestic","국내판"]].map(function(r){
            return CATS.map(function(c){
              var n = items(day, r[0]).filter(function(it){ return it.cat === c[0]; }).length;
              return '<li><a href="#' + r[0] + '-' + c[0] + '">' + r[1] + ' · ' + c[1] + '</a><span>' + n + '건</span></li>';
            }).join("");
          }).join("")
        + '</ul></div></aside></section>';
    }

    [["intl","해외판","INTERNATIONAL EDITION"],["domestic","국내판","DOMESTIC EDITION"]].forEach(function(r){
      var list = items(day, r[0]).filter(function(it){ return !lead || it.url !== lead.url; });
      html += '<div class="section-h"><h3>' + r[1] + '</h3><span class="en">' + r[2] + '</span></div><div class="cols">';
      CATS.forEach(function(c){
        var col = list.filter(function(it){ return it.cat === c[0]; });
        html += '<div class="col" id="' + r[0] + '-' + c[0] + '"><div class="col-h">' + c[1] + '</div>';
        if (!col.length) html += '<div class="empty">오늘은 실을 기사가 없습니다</div>';
        col.forEach(function(it, i){
          html += '<article class="story">' + (i === 0 && it.image ? img(it) : "")
            + '<h4><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></h4>'
            + '<p>' + rich(it.insight) + '</p><div class="meta">' + meta(it) + '</div></article>';
        });
        html += '</div>';
      });
      html += '</div>';
    });

    document.getElementById("paper").innerHTML = html;

    var al = document.getElementById("archiveList");
    al.innerHTML = dates.map(function(d){
      return '<button type="button" data-date="' + d.intl.date + '" aria-current="' + (d.intl.date === date) + '">NO.' + issueNo(d.intl.date) + ' · ' + shortDate(d.intl.date) + '</button>';
    }).join("");
    document.getElementById("archive").hidden = false;
  }

  var today = kstToday();
  var tries = [];
  for (var i = 0; i < LOOKBACK; i++) tries.push(shift(today, -i));
  Promise.all(tries.map(function(d){
    return fetch("data/" + d + ".json", {cache: "no-cache"}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  })).then(function(res){
    var days = res.filter(Boolean);
    if (!days.length){ document.getElementById("paper").innerHTML = '<div class="loading">발행된 신문이 없습니다.</div>'; return; }
    var want = new URLSearchParams(location.search).get("date");
    var cur = days.find(function(d){ return d.intl.date === want; }) || days[0];
    render(cur, days);
    document.getElementById("archiveList").addEventListener("click", function(e){
      var b = e.target.closest("button[data-date]");
      if (!b) return;
      var d = days.find(function(x){ return x.intl.date === b.dataset.date; });
      history.replaceState(null, "", "?date=" + d.intl.date);
      render(d, days);
      window.scrollTo({top: 0, behavior: "smooth"});
    });
  });
})();
</script>
</body>
</html>
